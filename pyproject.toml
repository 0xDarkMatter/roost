[project]
name = "roost"
version = "0.3.0"
description = "Pick the healthiest Claude Code profile — health taxonomy + load balancer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "roost contributors" }]
keywords = ["claude", "claude-code", "anthropic", "oauth", "load-balancer", "cli", "forma", "roost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "platformdirs>=4.0.0",
    "filelock>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
roost = "claude_lb.cli:app"
claude-lb = "claude_lb.cli:app"

[project.urls]
Homepage = "https://github.com/0xDarkMatter/roost"
Issues = "https://github.com/0xDarkMatter/roost/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_lb"]

[tool.hatch.build.targets.wheel.force-include]
"src/claude_lb/py.typed" = "claude_lb/py.typed"

[tool.forma]
description = "Pick the healthiest Claude Code Max profile"
resources = ["profiles"]
auth = "none"
status = "experimental"
origin = "forma"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",   # Typer uses function-call defaults (e.g. typer.Option())
    "UP042",  # str+Enum inheritance is intentional (pydantic/JSON-serialisation compat)
    "SIM103", # Negated conditions in filter ladder are clearer inline
    "SIM105", # try/except/pass is the right shape for best-effort cleanup
    "E501",   # Long-line policing is opinionated; line-length=100 is already the cap
    "B905",   # zip() without strict= — many stdlib-style usages are fine
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests are skipped by default. Run them explicitly with `pytest -m live`
# (or `pytest -m "not live"` to be explicit about excluding them, though that
# is the default below).
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: requires real ~/.claude-profiles/ fleet — skip by default; run with `pytest -m live`",
]

[tool.coverage.run]
source = ["src/claude_lb"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
